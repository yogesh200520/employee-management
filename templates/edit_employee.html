<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Employee Management System</a>
        </div>
    </nav>

    <div class="container" style="max-width: 700px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <div class="card p-4">
            <h4 class="mb-3">Edit Employee #{{ employee['id'] }}</h4>
            <form method="post" action="{{ url_for('edit_employee', emp_id=employee['id']) }}">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" value="{{ employee['name'] }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" value="{{ employee['email'] }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" value="{{ employee['phone'] }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text" name="department" value="{{ employee['department'] }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Job Role</label>
                    <input type="text" name="job_role" value="{{ employee['job_role'] }}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Salary</label>
                    <input type="number" name="salary" value="{{ employee['salary'] }}" step="0.01" min="0" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Update Employee</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
